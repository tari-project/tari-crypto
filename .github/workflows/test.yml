on: [push, pull_request]

name: Test

permissions:
  contents: read

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust:
          - stable
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install components
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - name: test/debug
        run: cargo +stable test --locked
      - name: test/release
        run: cargo +stable test --locked --release
      - name: test/debug features
        run: cargo +stable test --locked --all-features
      - name: test/release features
        run: cargo +stable test --locked --release --all-features
      - name: Build documentation
        run: cargo doc --locked --all-features --no-deps
