name: Security audit
on:
  pull_request:
  push:
    branches:
      - main
  # Runs daily at 12:10
  schedule:
    - cron:  '10 12 * * *'

permissions:
  contents: read

jobs:
  security_audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # audit-check publishes a check run on push and opens issues on schedule
      checks: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      # audit-check uses cargo-audit from PATH when present instead of installing an unpinned one
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit --version 0.22.2
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Keep in sync with deny.toml [advisories] ignore
          ignore: RUSTSEC-2025-0141
