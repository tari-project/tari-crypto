name: Source Coverage
on:
  push:
    branches:
      - main
env:
  RUSTUP_TOOLCHAIN: "stable"
permissions:
  contents: read
jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y jq lcov
      - name: Download Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
          components: llvm-tools-preview
      - name: Install requirements for code coverage
        run: |
          cargo install --locked cargo-binutils --version 0.4.0
          cargo install --locked rustfilt --version 0.2.2
      - name: Run test coverage
        id: coverage
        env:
          SKIP_HTML: '1'
        run: |
          /bin/bash -c ./test_coverage.sh
      - name: Coveralls upload
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: ./cov_raw/tari_crypto.lcov
