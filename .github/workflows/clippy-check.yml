name: Formatting, lints, and code checks
on: [push, pull_request]

permissions:
  contents: read

jobs:
  clippy_check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install components
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          components: clippy, rustfmt
          toolchain: nightly
      - name: Toolchain stable
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          components: clippy, rustfmt
          toolchain: stable
      - name: Check formatting
        run: cargo +nightly fmt --all -- --check
      - name: Install linter
        run: cargo install --locked cargo-lints --version 0.1.0
      - name: Run linter
        run: cargo lints clippy --locked --all-targets --all-features
      - name: Check code
        run: cargo +stable check --locked --release --all-targets
      - name: Check code (no default features)
        run: cargo +stable check --locked --release --no-default-features
      - name: Check benchmarks
        run: cargo +nightly check --locked --benches
